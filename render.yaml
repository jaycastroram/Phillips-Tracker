services:
  - type: web
    name: phillips-tracker
    env: python
    buildCommand: python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: python backend/app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phillips-tracker-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

databases:
  - name: phillips-tracker-db
