services:
  - type: web
    name: smartbuy-tracker
    env: python
    buildCommand: python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: python backend/app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartbuy-tracker-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # The catalog sync: read-only SuiteQL over a NetSuite TBA token. The
      # button and the last-run line need the same set as the cron.
      - key: NETSUITE_SYNC_COMPANY_SLUG
        sync: false
      - key: NETSUITE_CONSUMER_KEY
        sync: false
      - key: NETSUITE_CONSUMER_SECRET
        sync: false
      - key: NETSUITE_TOKEN_ID
        sync: false
      - key: NETSUITE_TOKEN_SECRET
        sync: false
      - key: NETSUITE_REALM
        sync: false
      - key: NETSUITE_BASE_URL
        sync: false

  # Nightly reconciliation of the catalog against the NetSuite item master,
  # 07:00 UTC. Read-only towards NetSuite; the catalog writes are ours.
  - type: cron
    name: smartbuy-catalog-sync
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python backend/scripts/sync_catalog.py --apply
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartbuy-tracker-db
          property: connectionString
      - key: NETSUITE_SYNC_COMPANY_SLUG
        sync: false
      - key: NETSUITE_CONSUMER_KEY
        sync: false
      - key: NETSUITE_CONSUMER_SECRET
        sync: false
      - key: NETSUITE_TOKEN_ID
        sync: false
      - key: NETSUITE_TOKEN_SECRET
        sync: false
      - key: NETSUITE_REALM
        sync: false
      - key: NETSUITE_BASE_URL
        sync: false

databases:
  - name: smartbuy-tracker-db
